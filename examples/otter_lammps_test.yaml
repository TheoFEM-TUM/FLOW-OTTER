### MD configuration
path_FF_MD: "/home/hpc/b299bb/b299bb25/mace.pt"                 # INSERT HERE
dir_ini_MD: "/home/hpc/b299bb/b299bb25/initial_config"  # INSERT HERE
MD_type: "lammps+MACE"
equilibrate: True
npt_equilibrate: True

resources_MD: "48:1:a100:1h"                               # ADAPT THIS TO YOUR SYSTEM  
ranks_MD: 48                                                # ADAPT THIS TO YOUR SYSTEM   

vdos_omega_max: 10.0


lammps:
  units: "metal"         
  dimension: 3
  boundary: "p p p"
  atom_style: "atomic"

  restart: false                                  
  ini_MD_file: "TaCuN2_unrelaxed.lmp"                  # INSERT HERE

  T_start: 25.0
  T_damp: 0.6                         
  P_damp: 6.0                          
  
  dt: 0.006                                 

  elements: ["Ta", "Cu", "N"]               

  thermo_output_step_size: 10

  eqsteps_nvt_heating: 1500
  eqsteps_nvt: 10000                    

  eqsteps_npt_expansion: 1500
  eqsteps_npt: 20000

  prodrun_numsteps: 10000                
  prodrun_stepsize: 2


